name: patch applies

# Guards the one thing that silently rots in a patch repository: the day the upstream commit this
# patch was generated against no longer accepts it.
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so drift is noticed even without a push.
    - cron: '23 4 * * 1'

jobs:
  patch-applies:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Must be a full 40-character SHA: `git fetch origin <sha>` cannot resolve short forms.
      PIN_SHA: 1715e55076737158ba61d43158ede504de6d4ce1
    steps:
      - uses: actions/checkout@v4

      - name: Check the README pins the same commit as this workflow
        run: |
          set -euo pipefail
          if ! grep -q "$PIN_SHA" README.md; then
            echo "::error::README.md does not mention the pinned commit $PIN_SHA"
            exit 1
          fi
          echo "README and workflow agree on $PIN_SHA"

      - name: Fetch exactly that commit from openai/codex
        run: |
          set -euo pipefail
          git init upstream
          git -C upstream remote add origin https://github.com/openai/codex.git
          if ! git -C upstream fetch --depth 1 origin "$PIN_SHA"; then
            echo "fetch by SHA failed; falling back to a blobless clone"
            rm -rf upstream
            git clone --filter=blob:none --no-checkout https://github.com/openai/codex.git upstream
            git -C upstream fetch origin "$PIN_SHA"
          fi
          git -C upstream checkout --detach FETCH_HEAD

      - name: Verify the checkout is real
        run: |
          set -euo pipefail
          actual="$(git -C upstream rev-parse HEAD)"
          if [ "$actual" != "$PIN_SHA" ]; then
            echo "::error::checked out $actual, expected $PIN_SHA"
            exit 1
          fi
          # Without this, `git apply --check` in an empty tree can pass vacuously.
          test -f upstream/codex-rs/Cargo.toml
          test -f upstream/codex-rs/core/src/config/mod.rs
          echo "checked out $actual with the expected tree"

      - name: Check the patch applies cleanly
        run: |
          set -euo pipefail
          git -C upstream apply --check --verbose "$GITHUB_WORKSPACE/patch/model-provider-routes.patch"

      - name: Apply it and require the expected files to change
        run: |
          set -euo pipefail
          git -C upstream apply "$GITHUB_WORKSPACE/patch/model-provider-routes.patch"
          # Count with status, not diff: the patch also adds a new file, and untracked files do not
          # appear in `git diff`.
          changed="$(git -C upstream status --porcelain | wc -l)"
          echo "changed or added files: $changed"
          git -C upstream diff --stat | tail -n 1
          if [ "$changed" -lt 10 ]; then
            echo "::error::expected the patch to touch or add at least 10 files, saw $changed"
            exit 1
          fi
